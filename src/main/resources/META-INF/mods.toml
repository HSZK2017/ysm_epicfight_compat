[[mods]]
modId="ysm_epicfight_compat"
version="1.9.0"
displayName="YSM Epic Fight Compat"
description = '''
Bridges Yes Steve Model custom player models into the Epic Fight combat animation system.

Converts YSM Bedrock-format models into Epic Fight SkinnedMesh at runtime,
enabling your custom YSM avatar to use Epic Fight combat animations seamlessly.

Gameplay:
- Combat mode: Epic Fight renders your YSM model using combat animations
- Idle mode: YSM handles rendering with its own animation system as normal
'''
